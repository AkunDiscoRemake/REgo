name: Compilar APK (VR Box)
# Gera o APK do Wpollo VR como artefato do Actions (não publica em Releases).
on:
  workflow_dispatch:
  push:
    branches: [main, master, ccr-53710242-ie57y5]
    paths: ['android/**', 'js/**', 'assets/**', 'css/**', 'index.html']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Compilar
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: WpolloVR-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
