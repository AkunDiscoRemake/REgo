plugins { id 'com.android.application' }

android {
    namespace 'com.wpollo.vr'
    compileSdk 34
    defaultConfig {
        applicationId 'com.wpollo.vr'
        minSdk 26
        multiDexEnabled true
        targetSdk 34
        versionCode 2
        versionName '2.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
    buildFeatures { aidl true; buildConfig false }
    sourceSets { main { assets.srcDirs = ["$buildDir/www-assets"] } }
    androidResources { noCompress += ['onnx', 'wasm', 'glb', 'jpg', 'png', 'mjs', 'js'] }
    packagingOptions { jniLibs { useLegacyPackaging = false } }
    lint { checkReleaseBuilds false; abortOnError false }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    // inferência nativa das mãos: ONNX Runtime com NNAPI (usa a NPU/DSP do celular quando existe)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    // YouTube por código aberto (NewPipeExtractor, GPL-3.0) — só no APK
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.24.8'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.2'
    // Shizuku: permissões de shell sem root para abrir apps Android em janelas
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}

// copia o site (mesmo código da versão web) para dentro do APK: tudo local, sem rede, menor latência
tasks.register('syncWww', Sync) {
    def root = rootProject.projectDir.parentFile
    from(root) {
        include 'index.html', 'manifest.webmanifest', 'css/**', 'js/**', 'assets/**'
        // no APK as mãos rodam nativamente (NNAPI): o modelo fp16 e o wasm do WebGPU não são necessários
        exclude 'assets/ml/hand_pose_fp16.onnx', 'js/vendor/ort/ort-wasm-simd-threaded.jsep.*', 'assets/icons/**'
    }
    from("$root/android/native-models") { into 'assets/ml' }
    into "$buildDir/www-assets/www"
}
preBuild.dependsOn syncWww
